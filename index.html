<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>photoZAP|写真データをまとめて軽量化！</title>
    <link rel="icon" href="apple-touch-icon.png">
    <link rel="apple-touch-icon" href="apple-touch-icon.png">
    <style>
        /* --- デザイン設定 (完全オフライン用) --- */
        :root {
            --primary: #FF6B8B;
            --secondary: #4ECDC4;
            --bg-light: #F7F9FC;
            --text-dark: #333333;
            --text-gray: #777777;
        }

        body {
            font-family: 'Hiragino Kaku Gothic ProN', 'Meiryo', sans-serif;
            background-color: #e2e8f0;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .app-container {
            background-color: white;
            border-radius: 24px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
            width: 100%;
            max-width: 600px;
            overflow: hidden;
            border: 4px solid white;
        }

        .header {
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            text-align: center;
            color: white;
            padding: 0; /* ロゴ画像がぴったり収まるように余白をなくす */
            line-height: 0; /* 画像の下にできる不要な隙間を消す */
        }

        .header h1 {
            margin: 0;
            font-size: 28px;
            font-weight: 900;
            letter-spacing: 2px;
            text-shadow: 1px 1px 3px rgba(0,0,0,0.2);
        }
        .header span {
            display: block;
            font-size: 16px;
            margin-top: 5px;
        }

        .content {
            padding: 25px;
        }

        .section-box {
            background-color: var(--bg-light);
            border: 2px solid #edf2f7;
            border-radius: 16px;
            padding: 20px;
            margin-bottom: 20px;
        }

        .section-title {
            font-weight: bold;
            color: var(--text-dark);
            margin-bottom: 15px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        label {
            color: var(--text-dark);
            font-size: 14px;
            font-weight: bold;
        }

        input[type="number"] {
            padding: 8px;
            border: 1px solid #ccc;
            border-radius: 8px;
            width: 80px;
            text-align: center;
            font-size: 14px;
        }
        input[type="number"]:disabled {
            background-color: #e2e8f0;
            color: #a0aec0;
        }

        .note {
            font-size: 11px;
            color: var(--text-gray);
            margin-top: 10px;
            line-height: 1.4;
        }

        /* カスタムトグルスイッチ */
        .toggle-switch {
            position: relative;
            display: inline-block;
            width: 50px;
            height: 24px;
        }
        .toggle-switch input {
            opacity: 0;
            width: 0;
            height: 0;
        }
        .slider {
            position: absolute;
            cursor: pointer;
            top: 0; left: 0; right: 0; bottom: 0;
            background-color: #ccc;
            transition: .4s;
            border-radius: 24px;
        }
        .slider:before {
            position: absolute;
            content: "";
            height: 18px;
            width: 18px;
            left: 3px;
            bottom: 3px;
            background-color: white;
            transition: .4s;
            border-radius: 50%;
        }
        input:checked + .slider.size-toggle { background-color: var(--secondary); }
        input:checked + .slider.data-toggle { background-color: var(--primary); }
        input:checked + .slider:before { transform: translateX(26px); }

        .options-group {
            margin-top: 10px;
            padding-left: 10px;
            transition: opacity 0.3s;
        }
        .options-group.disabled {
            opacity: 0.4;
            pointer-events: none;
        }
        
        .radio-line {
            margin-bottom: 10px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        /* ファイル入力のデザイン */
        input[type="file"] {
            margin-top: 10px;
            font-size: 14px;
        }

        /* 実行ボタン */
        .zap-btn {
            background-color: var(--primary);
            color: white;
            border: none;
            width: 100%;
            padding: 18px;
            font-size: 20px;
            font-weight: bold;
            border-radius: 30px;
            cursor: pointer;
            box-shadow: 0 4px 10px rgba(255, 107, 139, 0.4);
            transition: all 0.2s;
        }
        .zap-btn:hover {
            background-color: #ff4a70;
            transform: translateY(-2px);
        }
        .zap-btn:disabled {
            background-color: #ccc;
            box-shadow: none;
            cursor: not-allowed;
            transform: none;
        }

        /* プログレスバー */
        .progress-container {
            display: none;
            margin-top: 20px;
        }
        .progress-texts {
            display: flex;
            justify-content: space-between;
            font-size: 12px;
            font-weight: bold;
            color: var(--text-dark);
            margin-bottom: 5px;
        }
        .progress-bar-bg {
            background-color: #edf2f7;
            border-radius: 10px;
            height: 12px;
            overflow: hidden;
        }
        .progress-bar-fill {
            background-color: var(--secondary);
            height: 100%;
            width: 0%;
            transition: width 0.3s;
        }

        /* ログエリア */
        .log-area {
            display: none;
            margin-top: 20px;
        }
        .log-area textarea {
            width: 95%;
            height: 100px;
            background-color: #2d3748;
            color: #48bb78;
            border-radius: 8px;
            padding: 10px;
            font-family: monospace;
            font-size: 11px;
            border: none;
            resize: none;
        }
    </style>
</head>
<body>

    <div class="app-container">
        <!-- ヘッダー -->
        <div class="header">
            <img src="logo.png" alt="PHOTOZAP" width="600" height="110" style="width: 100%; max-width: 600px; height: auto; display: block; margin: 0 auto;">
        </div>

        <div class="content">
            
            <!-- 画像選択エリア -->
            <div class="section-box">
                <label>📁 変換する画像を選択:</label><br>
                
                <div style="margin-top: 10px; padding: 10px; background-color: #fff; border-radius: 8px; border: 1px solid #e2e8f0;">
                    <div style="font-size: 12px; font-weight: bold; color: var(--text-dark); margin-bottom: 5px;">📱 スマホ・PC (写真を選択)</div>
                    <input type="file" id="fileInput" multiple accept="image/jpeg, image/png, image/webp" style="margin-top: 0;">
                </div>

                <div style="margin-top: 10px; padding: 10px; background-color: #fff; border-radius: 8px; border: 1px solid #e2e8f0;">
                    <div style="font-size: 12px; font-weight: bold; color: var(--text-dark); margin-bottom: 5px;">💻 PC専用 (フォルダごと選択できます)</div>
                    <input type="file" id="folderInput" webkitdirectory directory multiple style="margin-top: 0;">
                </div>

                <div class="note" id="fileCountDisplay" style="margin-top: 15px; font-weight: bold; font-size: 13px; color: var(--primary);">未選択</div>
            </div>

            <!-- サイズ指定エリア -->
            <div class="section-box">
                <div class="section-title">
                    <span>📐 サイズを指定する</span>
                    <label class="toggle-switch">
                        <input type="checkbox" id="toggleSize">
                        <span class="slider size-toggle"></span>
                    </label>
                </div>

                <div id="sizeOptions" class="options-group disabled">
                    <div class="radio-line">
                        <input type="radio" name="sizeMode" value="longEdge" id="radioLongEdge" checked>
                        <label for="radioLongEdge">長辺を合わせる (px):</label>
                        <input type="number" id="longEdgeValue" value="1000">
                    </div>
                    <div class="radio-line">
                        <input type="radio" name="sizeMode" value="percent" id="radioPercent">
                        <label for="radioPercent">縮小率 (%):</label>
                        <input type="number" id="percentValue" value="50" disabled>
                    </div>
                </div>
            </div>

            <!-- データ量指定エリア -->
            <div class="section-box">
                <div class="section-title">
                    <span>🗜️ データ量を指定する</span>
                    <label class="toggle-switch">
                        <input type="checkbox" id="toggleData" checked>
                        <span class="slider data-toggle"></span>
                    </label>
                </div>

                <div id="dataOptions" class="options-group">
                    <div class="radio-line">
                        <label>目標サイズ (KB):</label>
                        <input type="number" id="targetKbValue" value="200">
                    </div>
                    <div class="note">
                        ※PNGは自動的に背景白のJPEGに変換されます。<br>
                        ※指定サイズに収まらない場合は自動でピクセル数を削ります。
                    </div>
                </div>
            </div>

            <!-- 実行ボタン -->
            <button id="startBtn" class="zap-btn">ZAP! (ZIPで一括保存)</button>
            

            <!-- プログレスバー -->
            <div id="progressArea" class="progress-container">
                <div class="progress-texts">
                    <span id="statusText">準備中...</span>
                    <span id="progressText">0%</span>
                </div>
                <div class="progress-bar-bg">
                    <div id="progressBar" class="progress-bar-fill"></div>
                </div>
            </div>

            <!-- ログ表示エリア -->
            <div id="logArea" class="log-area">
                <label style="font-size: 12px;">📝 処理ログ:</label><br>
                <textarea id="logConsole" readonly></textarea>
            </div>

        </div>
    </div>

    <div style="margin-top: 15px; font-size: 12px; color: var(--text-gray);">
        2026 ココサポートワークス
    </div>

    <script>
        // --- 独自実装: 軽量・完全オフラインZIPジェネレーター ---
        // 外部ライブラリを読み込めない環境のため、プログラム内でZIPファイル(無圧縮)を生成します。
        class SimpleOfflineZip {
            constructor() {
                this.files = [];
                this.crcTable = new Uint32Array(256);
                for (let n = 0; n < 256; n++) {
                    let c = n;
                    for (let k = 0; k < 8; k++) { c = ((c & 1) ? (0xEDB88320 ^ (c >>> 1)) : (c >>> 1)); }
                    this.crcTable[n] = c;
                }
            }

            crc32(uint8Array) {
                let crc = 0xFFFFFFFF;
                for (let i = 0; i < uint8Array.length; i++) {
                    crc = (crc >>> 8) ^ this.crcTable[(crc ^ uint8Array[i]) & 0xFF];
                }
                return (crc ^ 0xFFFFFFFF) >>> 0;
            }

            addFile(name, uint8Array, date = new Date()) {
                // ZIP(MS-DOS)形式のタイムスタンプに変換して保持
                const dosTime = (date.getSeconds() >> 1) | (date.getMinutes() << 5) | (date.getHours() << 11);
                const dosDate = date.getDate() | ((date.getMonth() + 1) << 5) | ((date.getFullYear() - 1980) << 9);
                this.files.push({ name: name, data: uint8Array, dosTime: dosTime, dosDate: dosDate });
            }

            generateBlob() {
                let zipData = [];
                let centralDirectory = [];
                let offset = 0;
                const encoder = new TextEncoder(); // 日本語ファイル名対応(UTF-8)

                for (const file of this.files) {
                    const nameBytes = encoder.encode(file.name);
                    const nameLen = nameBytes.length;
                    const dataLen = file.data.length;
                    const crc = this.crc32(file.data);

                    // Local File Header
                    const lfh = new Uint8Array(30 + nameLen);
                    const lfhView = new DataView(lfh.buffer);
                    lfhView.setUint32(0, 0x04034b50, true); // Signature
                    lfhView.setUint16(4, 10, true);         // Version
                    lfhView.setUint16(6, 0x0800, true);     // Flags (Bit 11 = UTF-8)
                    lfhView.setUint16(8, 0, true);          // Compression (0 = Store)
                    lfhView.setUint16(10, file.dosTime, true); // Last mod file time
                    lfhView.setUint16(12, file.dosDate, true); // Last mod file date
                    lfhView.setUint32(14, crc, true);       // CRC32
                    lfhView.setUint32(18, dataLen, true);   // Comp size
                    lfhView.setUint32(22, dataLen, true);   // Uncomp size
                    lfhView.setUint16(26, nameLen, true);   // Name length
                    lfh.set(nameBytes, 30);
                    
                    zipData.push(lfh);
                    zipData.push(file.data);

                    // Central Directory Header
                    const cdh = new Uint8Array(46 + nameLen);
                    const cdhView = new DataView(cdh.buffer);
                    cdhView.setUint32(0, 0x02014b50, true); // Signature
                    cdhView.setUint16(4, 10, true);         // Version made by
                    cdhView.setUint16(6, 10, true);         // Version needed
                    cdhView.setUint16(8, 0x0800, true);     // Flags (Bit 11 = UTF-8)
                    cdhView.setUint16(10, 0, true);         // Compression
                    cdhView.setUint16(12, file.dosTime, true); // Last mod file time
                    cdhView.setUint16(14, file.dosDate, true); // Last mod file date
                    cdhView.setUint32(16, crc, true);       // CRC32
                    cdhView.setUint32(20, dataLen, true);   // Comp size
                    cdhView.setUint32(24, dataLen, true);   // Uncomp size
                    cdhView.setUint16(28, nameLen, true);   // Name length
                    cdhView.setUint32(42, offset, true);    // Offset
                    cdh.set(nameBytes, 46);

                    centralDirectory.push(cdh);
                    offset += lfh.length + dataLen;
                }

                const cdSize = centralDirectory.reduce((acc, val) => acc + val.length, 0);

                // End of Central Directory Record
                const eocd = new Uint8Array(22);
                const eocdView = new DataView(eocd.buffer);
                eocdView.setUint32(0, 0x06054b50, true); // Signature
                eocdView.setUint16(8, this.files.length, true); // Total records
                eocdView.setUint16(10, this.files.length, true); 
                eocdView.setUint32(12, cdSize, true);    // CD Size
                eocdView.setUint32(16, offset, true);    // CD Offset

                return new Blob([...zipData, ...centralDirectory, eocd], { type: 'application/zip' });
            }
        }
        // -----------------------------------------------------------

        // UIの要素を取得
        const toggleSize = document.getElementById('toggleSize');
        const sizeOptions = document.getElementById('sizeOptions');
        const radioLongEdge = document.getElementById('radioLongEdge');
        const radioPercent = document.getElementById('radioPercent');
        const longEdgeInput = document.getElementById('longEdgeValue');
        const percentInput = document.getElementById('percentValue');

        const toggleData = document.getElementById('toggleData');
        const dataOptions = document.getElementById('dataOptions');
        const targetKbValue = document.getElementById('targetKbValue');

        const fileInput = document.getElementById('fileInput');
        const folderInput = document.getElementById('folderInput');
        const fileCountDisplay = document.getElementById('fileCountDisplay');

        // トグルの動き
        toggleSize.addEventListener('change', (e) => {
            if(e.target.checked) sizeOptions.classList.remove('disabled');
            else sizeOptions.classList.add('disabled');
        });

        toggleData.addEventListener('change', (e) => {
            if(e.target.checked) dataOptions.classList.remove('disabled');
            else dataOptions.classList.add('disabled');
        });

        // ラジオボタンの動き
        const updateRadios = () => {
            if (radioLongEdge.checked) {
                longEdgeInput.disabled = false;
                percentInput.disabled = true;
            } else {
                longEdgeInput.disabled = true;
                percentInput.disabled = false;
            }
        };
        radioLongEdge.addEventListener('change', updateRadios);
        radioPercent.addEventListener('change', updateRadios);

        // ファイル/フォルダ選択時の処理
        let targetFiles = [];
        
        function handleFileSelect(e) {
            const files = Array.from(e.target.files);
            const validExts = ['image/jpeg', 'image/png', 'image/webp'];
            targetFiles = files.filter(file => validExts.includes(file.type));
            fileCountDisplay.textContent = `JPEG/PNG/WebPファイル: ${targetFiles.length}枚 見つかりました`;
        }

        fileInput.addEventListener('change', (e) => {
            folderInput.value = ""; // もう一方をリセット
            handleFileSelect(e);
        });

        folderInput.addEventListener('change', (e) => {
            fileInput.value = ""; // もう一方をリセット
            handleFileSelect(e);
        });

        // ログ機能
        const logConsole = document.getElementById('logConsole');
        function addLog(message, isError = false) {
            const time = new Date().toLocaleTimeString();
            const prefix = isError ? "[ERROR]" : "[INFO]";
            logConsole.value += `${time} ${prefix} ${message}\n`;
            logConsole.scrollTop = logConsole.scrollHeight;
        }

        // --- コアの画像処理 ---
        const startBtn = document.getElementById('startBtn');
        const progressArea = document.getElementById('progressArea');
        const logArea = document.getElementById('logArea');
        const statusText = document.getElementById('statusText');
        const progressText = document.getElementById('progressText');
        const progressBar = document.getElementById('progressBar');

        function readFileAsDataURL(file) {
            return new Promise((resolve, reject) => {
                const reader = new FileReader();
                reader.onload = (e) => resolve(e.target.result);
                reader.onerror = (e) => reject(e);
                reader.readAsDataURL(file);
            });
        }

        function loadImage(src) {
            return new Promise((resolve, reject) => {
                const img = new Image();
                img.onload = () => resolve(img);
                img.onerror = (e) => reject(e);
                img.src = src;
            });
        }

        function getBase64Size(base64Str) {
            const str = base64Str.split(',')[1];
            return atob(str).length;
        }

        function dataUrlToUint8Array(dataUrl) {
            const base64Str = dataUrl.split(',')[1];
            const binaryStr = atob(base64Str);
            const len = binaryStr.length;
            const bytes = new Uint8Array(len);
            for (let i = 0; i < len; i++) {
                bytes[i] = binaryStr.charCodeAt(i);
            }
            return bytes;
        }

        // 次のUI描画を待つための関数（フリーズ防止）
        function yieldToMain() {
            return new Promise(resolve => setTimeout(resolve, 0));
        }

        startBtn.addEventListener('click', async () => {
            if (targetFiles.length === 0) {
                alert("フォルダを選択してください。");
                return;
            }
            if (!toggleSize.checked && !toggleData.checked) {
                alert("サイズ指定かデータ量指定のどちらかを有効にしてください。");
                return;
            }

            // 初期化
            startBtn.disabled = true;
            progressArea.style.display = 'block';
            logArea.style.display = 'block';
            logConsole.value = "";
            addLog("=== PHOTOZAP 処理開始 ===");

            let successCount = 0;
            let errorCount = 0;

            const useSize = toggleSize.checked;
            const useData = toggleData.checked;
            const isLongEdge = radioLongEdge.checked;
            const longEdge = parseInt(longEdgeInput.value);
            const percent = parseInt(percentInput.value) / 100;
            const targetBytes = parseFloat(targetKbValue.value) * 1024;

            // フォルダ名の取得（PCでの「フォルダごと選択」用）
            let folderName = "";
            if (targetFiles.length > 0 && targetFiles[0].webkitRelativePath) {
                const parts = targetFiles[0].webkitRelativePath.split('/');
                if (parts.length > 1) {
                    folderName = parts[0]; // 最初のスラッシュより前の文字（＝フォルダ名）を取得
                }
            }

            // ZIPジェネレーターを準備
            const myZip = new SimpleOfflineZip();

            for (let i = 0; i < targetFiles.length; i++) {
                const file = targetFiles[i];
                
                // UI更新
                statusText.textContent = `${i + 1} / ${targetFiles.length} 枚目を処理中...`;
                const progress = Math.round(((i) / targetFiles.length) * 100);
                progressBar.style.width = `${progress}%`;
                progressText.textContent = `${progress}%`;
                await yieldToMain(); // 画面を更新させる

                try {
                    const dataUrl = await readFileAsDataURL(file);
                    let img = await loadImage(dataUrl);
                    
                    let canvas = document.createElement('canvas');
                    let ctx = canvas.getContext('2d');
                    
                    let w = img.width;
                    let h = img.height;

                    // 1. サイズ変更
                    if (useSize) {
                        if (isLongEdge) {
                            if (w > h) {
                                h = Math.round(h * (longEdge / w));
                                w = longEdge;
                            } else {
                                w = Math.round(w * (longEdge / h));
                                h = longEdge;
                            }
                        } else {
                            w = Math.round(w * percent);
                            h = Math.round(h * percent);
                        }
                    }

                    canvas.width = w;
                    canvas.height = h;

                    // 形式決定
                    let outFormat = file.type;
                    let outExt = file.name.substring(file.name.lastIndexOf('.'));
                    
                    if (useData && (file.type === 'image/png' || file.type === 'image/webp')) {
                        outFormat = 'image/jpeg';
                        outExt = '.jpg';
                    }

                    if (outFormat === 'image/jpeg') {
                        ctx.fillStyle = '#FFFFFF';
                        ctx.fillRect(0, 0, w, h);
                    }
                    ctx.drawImage(img, 0, 0, w, h);

                    let finalDataUrl;

                    // 2. データ量指定（圧縮）
                    if (useData) {
                        let quality = 0.95;
                        while (true) {
                            finalDataUrl = canvas.toDataURL(outFormat, quality);
                            let currentSize = getBase64Size(finalDataUrl);

                            if (currentSize <= targetBytes || quality <= 0.1) {
                                if (currentSize > targetBytes) {
                                    // フェイルセーフ：ピクセル数を10%削る
                                    if (canvas.width < 10 || canvas.height < 10) throw new Error("限界まで縮小しました");
                                    
                                    let newW = Math.floor(canvas.width * 0.9);
                                    let newH = Math.floor(canvas.height * 0.9);
                                    let tempCanvas = document.createElement('canvas');
                                    tempCanvas.width = newW;
                                    tempCanvas.height = newH;
                                    let tempCtx = tempCanvas.getContext('2d');
                                    
                                    if (outFormat === 'image/jpeg') {
                                        tempCtx.fillStyle = '#FFFFFF';
                                        tempCtx.fillRect(0, 0, newW, newH);
                                    }
                                    tempCtx.drawImage(canvas, 0, 0, newW, newH);
                                    canvas = tempCanvas;
                                    quality = 0.85; 
                                    continue;
                                } else {
                                    break;
                                }
                            }
                            quality -= 0.05;
                        }
                    } else {
                        finalDataUrl = canvas.toDataURL(outFormat, 0.92);
                    }

                    // ファイル名の設定
                    let fileName = file.name;
                    if (outExt !== file.name.substring(file.name.lastIndexOf('.'))) {
                        fileName = file.name.substring(0, file.name.lastIndexOf('.')) + outExt;
                    }

                    // ZIPにファイルを追加（★元のファイルの更新日時を引き継ぐ）
                    const fileBytes = dataUrlToUint8Array(finalDataUrl);
                    myZip.addFile(fileName, fileBytes, new Date(file.lastModified));
                    
                    successCount++;
                    addLog(`[成功] ${fileName} をZIPに追加しました`);

                } catch (error) {
                    errorCount++;
                    addLog(`[エラー] ${file.name}: ${error.message}`, true);
                }
            }

            // 全処理完了後、ZIPを作成して1回だけダウンロード
            statusText.textContent = "ZIPファイルを作成中...";
            progressBar.style.width = `99%`;
            progressText.textContent = `99%`;
            await yieldToMain();

            try {
                const zipBlob = myZip.generateBlob();
                const downloadLink = document.createElement('a');
                downloadLink.href = URL.createObjectURL(zipBlob);
                
                // ZIPファイル名の決定（パターンA or パターンB）
                let zipFileName = "";
                if (folderName) {
                    // パターンA: フォルダごと選択した場合は「フォルダ名_photoZAP.zip」
                    zipFileName = `${folderName}_photoZAP.zip`;
                } else {
                    // パターンB: 写真のみ選択した場合は日時（今まで通り）
                    const now = new Date();
                    const yyyy = now.getFullYear();
                    const MM = String(now.getMonth() + 1).padStart(2, '0');
                    const dd = String(now.getDate()).padStart(2, '0');
                    const HH = String(now.getHours()).padStart(2, '0');
                    const mm = String(now.getMinutes()).padStart(2, '0');
                    const ss = String(now.getSeconds()).padStart(2, '0');
                    zipFileName = `photoZAP_${yyyy}${MM}${dd}_${HH}-${mm}-${ss}.zip`;
                }
                
                downloadLink.download = zipFileName;
                document.body.appendChild(downloadLink);
                downloadLink.click();
                document.body.removeChild(downloadLink);
                
                progressBar.style.width = `100%`;
                progressText.textContent = `100%`;
                statusText.textContent = "処理完了！ZIPファイルをダウンロードしました。";
                addLog("=== 処理完了 ===");
                addLog(`成功: ${successCount} 件, 失敗: ${errorCount} 件`);
                
                if (errorCount > 0) {
                    alert(`完了しましたが、${errorCount}件のエラーがあります。ログを確認してください。`);
                } else {
                    alert(`完了しました！画像はZIPファイルにまとめられてダウンロードされました。`);
                }
            } catch (e) {
                statusText.textContent = "ZIPファイルの作成に失敗しました。";
                addLog(`[重大なエラー] ZIP作成失敗: ${e.message}`, true);
            }

            startBtn.disabled = false;
        });
    </script>
    
</body>
</html>
